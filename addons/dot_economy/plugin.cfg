[plugin]

name="dot-economy"
description="A round-based buy economy: money, a shop of ids with prices and team restrictions, a buy window, refunds, and Counter-Strike's loss-bonus ladder. Sells ids and grants nothing, so a purchase validates without loading anything. Depends only on dot-core."
author="dot"
version="0.1.0"
script="dot_economy_plugin.gd"
